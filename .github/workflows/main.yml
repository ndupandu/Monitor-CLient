name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Alamat dashboard (kosong = pakai variabel repo APP_URL)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Siapkan keystore (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          APP_URL: ${{ github.event.inputs.app_url || vars.APP_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/*.apk MonitoringClient.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonitoringClient-apk
          path: MonitoringClient.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monitoring Client build ${{ github.run_number }}
          files: MonitoringClient.apk
